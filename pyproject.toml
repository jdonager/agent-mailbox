[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "agent-mailbox"
version = "0.1.0"
description = "Targeted knowledge transfer between agent sessions — so one session doesn't have to rediscover what another already knows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jonathon Donager" }
]
keywords = [
  "agents",
  "cli",
  "local-first",
  "json",
  "coordination",
  "developer-tools"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "rich>=13.7,<14.0",
  "ulid-py>=1.1,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0"
]

[project.scripts]
agent-mailbox = "agent_mailbox.cli:app"

[project.urls]
Homepage = "https://example.com/agent-mailbox"
Repository = "https://example.com/agent-mailbox.git"
Issues = "https://example.com/agent-mailbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mailbox"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM"
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"

[tool.coverage.run]
source = ["agent_mailbox"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
